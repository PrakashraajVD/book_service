services:
  db:
    image: postgres:18-alpine
    container_name: book
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book -d book"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always
